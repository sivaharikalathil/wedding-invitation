<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" fill="none">
  <!-- Nilavilakku Brass Lamp -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#805A10" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00" />
      <stop offset="40%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#FFEE58" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Flame at top -->
  <path d="M 50 15 C 44 26 40 33 50 44 C 60 33 56 26 50 15 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  <circle cx="50" cy="35" r="4" fill="#FFFF8D" />

  <!-- Top Crown / Thala -->
  <path d="M 47 44 L 53 44 L 52 49 L 48 49 Z" fill="url(#goldGrad)"/>
  <path d="M 44 49 C 44 49 50 47 56 49 L 55 53 C 55 53 50 51 45 53 Z" fill="url(#goldGrad)"/>

  <!-- Upper Bowl (Thattu) -->
  <ellipse cx="50" cy="55" rx="16" ry="4" fill="url(#goldGrad)"/>
  <path d="M 34 55 Q 50 63 66 55 Q 50 67 34 55 Z" fill="url(#goldGrad)"/>

  <!-- Upper Stem -->
  <path d="M 48 60 L 52 60 L 53 78 L 47 78 Z" fill="url(#goldGrad)"/>
  <!-- Middle Ornamental Ring -->
  <ellipse cx="50" cy="78" rx="8" ry="3" fill="url(#goldGrad)"/>
  <circle cx="50" cy="85" r="6" fill="url(#goldGrad)"/>
  <ellipse cx="50" cy="92" rx="8" ry="3" fill="url(#goldGrad)"/>

  <!-- Main Oil Reservoir Thattu -->
  <ellipse cx="50" cy="100" rx="30" ry="7" fill="url(#goldGrad)"/>
  <path d="M 20 100 Q 50 114 80 100 Q 50 120 20 100 Z" fill="url(#goldGrad)"/>

  <!-- Main Fluted Stem -->
  <path d="M 47 114 L 53 114 L 55 155 L 45 155 Z" fill="url(#goldGrad)"/>
  <!-- Decorative Rings on Stem -->
  <ellipse cx="50" cy="128" rx="7" ry="2.5" fill="url(#goldGrad)"/>
  <ellipse cx="50" cy="142" rx="8" ry="3" fill="url(#goldGrad)"/>

  <!-- Base (Kadam) Steps -->
  <ellipse cx="50" cy="158" rx="18" ry="5" fill="url(#goldGrad)"/>
  <ellipse cx="50" cy="168" rx="26" ry="7" fill="url(#goldGrad)"/>
  <ellipse cx="50" cy="178" rx="34" ry="9" fill="url(#goldGrad)"/>
  <path d="M 16 178 L 14 186 Q 50 198 86 186 L 84 178 Q 50 190 16 178 Z" fill="url(#goldGrad)"/>
  <!-- Bottom Plate -->
  <ellipse cx="50" cy="186" rx="36" ry="8" fill="url(#goldGrad)"/>
</svg>

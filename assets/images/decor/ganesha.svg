<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Auspicious Lord Ganesha Minimalist Gold Icon -->
  <defs>
    <linearGradient id="ganeshaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <filter id="ganeshaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Crown / Trinetra dot -->
  <circle cx="60" cy="22" r="3" fill="#D32F2F" />
  <path d="M 57 14 Q 60 8 63 14 Q 60 18 57 14 Z" fill="url(#ganeshaGold)" />

  <!-- Forehead Namam -->
  <path d="M 52 30 Q 60 26 68 30 Q 60 33 52 30 Z" fill="url(#ganeshaGold)" />
  <path d="M 50 36 Q 60 32 70 36 Q 60 39 50 36 Z" fill="url(#ganeshaGold)" />
  <circle cx="60" cy="33" r="2.5" fill="#D32F2F" />

  <!-- Large Left Ear / Head Curve -->
  <path d="M 50 34 C 32 30 20 45 28 62 C 34 74 44 76 52 74" 
        stroke="url(#ganeshaGold)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#ganeshaGlow)"/>

  <!-- Right Ear / Tusk -->
  <path d="M 70 34 C 84 30 96 45 88 62 C 84 68 78 72 72 73" 
        stroke="url(#ganeshaGold)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#ganeshaGlow)"/>
  <path d="M 68 62 L 76 63" stroke="url(#ganeshaGold)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Graceful Trunk Curving Right with Modak -->
  <path d="M 55 42 Q 53 66 57 82 Q 62 102 78 98 Q 88 94 82 82 Q 78 76 72 82" 
        stroke="url(#ganeshaGold)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#ganeshaGlow)"/>

  <!-- Modak / Laddu held by trunk tip -->
  <ellipse cx="71" cy="80" rx="4.5" ry="5.5" fill="#FFB300" stroke="url(#ganeshaGold)" stroke-width="1.5"/>
</svg>

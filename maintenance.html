<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>We'll Be Back Soon | Vidya Weds Siva</title>
  <link rel="icon" type="image/png" href="assets/images/monogram.png?v=20261001">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Outfit:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ivory: #faf7f0;
      --paper: #fffdf9;
      --maroon: #7d1929;
      --gold: #b58b2a;
      --green: #315b42;
      --ink: #302a24;
      --muted: #70675e;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      border-top: 4px solid var(--maroon);
      background: var(--ivory);
      color: var(--ink);
      font-family: "Outfit", sans-serif;
    }

    .page-header,
    .page-footer {
      width: min(100% - 48px, 1080px);
      margin-inline: auto;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-block: 14px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .brand-name {
      color: var(--maroon);
      font-family: "Cinzel", Georgia, serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    main {
      display: grid;
      place-items: center;
      padding: 24px 24px 32px;
      text-align: center;
    }

    .message { max-width: 620px; }

    .status-label {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      color: var(--green);
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .status-label::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      content: "";
    }

    h1 {
      margin: 0;
      color: var(--maroon);
      font-family: "Cinzel", Georgia, serif;
      font-size: 3rem;
      font-weight: 500;
      line-height: 1.2;
    }

    .ornament {
      width: 56px;
      height: 1px;
      margin: 18px auto;
      background: var(--gold);
    }

    .cat-illustration {
      display: block;
      width: 230px;
      height: 142px;
      margin: 0 auto 14px;
      overflow: visible;
    }

    .cat-tail {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: tailSway 2.6s ease-in-out infinite;
    }

    .cat-head {
      transform-box: fill-box;
      transform-origin: 55% 82%;
      animation: catIdle 2.8s ease-in-out infinite;
    }

    .cat-outline {
      fill: #f0dfca;
      stroke: var(--maroon);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 3;
    }

    .groom-cat .cat-outline { fill: #e9dcc9; }
    .bride-cat .cat-outline { fill: #fff1e8; }
    .cat-inner-ear { fill: #dba5a0; }
    .cat-belly { fill: #fff8ee; }
    .groom-cat .cat-belly,
    .bride-cat .cat-belly { fill: #fff8ee; }
    .cat-face-line {
      fill: none;
      stroke: var(--maroon);
      stroke-linecap: round;
      stroke-width: 2.5;
    }
    .cat-tail { fill: none; stroke-width: 8; }
    .cat-nose { fill: var(--maroon); }
    .cat-tail-bride { animation-delay: -1.3s; }
    .cat-head-bride { animation-delay: -1.4s; }
    .groom-bowtie { fill: var(--maroon); stroke: #fff8ee; stroke-width: 1.5; }
    .bride-flower { fill: #e9c66f; stroke: var(--maroon); stroke-width: 1.2; }
    .bride-flower-center { fill: var(--maroon); }
    @keyframes tailSway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(7deg); }
    }

    @keyframes catIdle {
      0%, 100% { transform: rotate(0) translateY(0); }
      50% { transform: rotate(-1deg) translateY(-2px); }
    }

    .message p {
      margin: 0;
      color: var(--muted);
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.08rem;
      line-height: 1.65;
    }

    .page-footer {
      padding-block: 10px 12px;
      border-top: 1px solid rgba(181, 139, 42, 0.35);
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      .page-header,
      .page-footer { width: min(100% - 32px, 1080px); }

      .page-header { padding-block: 12px; }

      main { padding: 24px 20px 28px; }

      h1 { font-size: 2.25rem; }

      .cat-illustration {
        width: 220px;
        height: 136px;
      }

      .message p {
        font-size: 1rem;
        line-height: 1.6;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cat-tail,
      .cat-head { animation: none; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <img class="brand-mark" src="assets/images/decor/ganesha.svg" alt="">
    <span class="brand-name">Vidya Weds Siva</span>
  </header>

  <main>
    <section class="message" aria-labelledby="maintenance-title">

      <h1 id="maintenance-title">We'll be back soon</h1>

          <ellipse class="cat-outline" cx="66" cy="132" rx="15" ry="8"></ellipse>

        <g class="cat bride-cat">
          <path class="cat-tail cat-tail-bride cat-face-line" d="M196 118 C222 128 238 106 224 95 C217 89 211 94 215 100"></path>
          <ellipse class="cat-outline" cx="177" cy="115" rx="34" ry="27"></ellipse>

          <g class="cat-head cat-head-bride">

            <path class="cat-inner-ear" d="M151 32 L163 43 L153 46 Z M193 43 L203 32 L202 47 Z"></path>

            <path class="cat-face-line" d="M162 65 Q167 71 172 65 M182 65 Q187 71 192 65"></path>
            <path class="cat-nose" d="M174 73 Q177 70 180 73 Q177 77 174 73 Z"></path>
            <path class="cat-face-line" d="M177 77 Q173 81 170 78 M177 77 Q181 81 184 78 M161 76 L147 73 M161 81 L148 84 M193 76 L206 73 M193 81 L205 84"></path>
          </g>
          <g aria-hidden="true">
            <circle class="bride-flower" cx="201" cy="48" r="4"></circle>
            <circle class="bride-flower" cx="207" cy="52" r="4"></circle>
            <circle class="bride-flower" cx="201" cy="56" r="4"></circle>
            <circle class="bride-flower" cx="195" cy="52" r="4"></circle>
            <circle class="bride-flower-center" cx="201" cy="52" r="2.3"></circle>
          </g>
          <ellipse class="cat-outline" cx="163" cy="132" rx="15" ry="8"></ellipse>
          <ellipse class="cat-outline" cx="188" cy="131" rx="15" ry="8"></ellipse>
        </g>
      </svg>
      <p>The groom is tweaking the code, the bride is checking the vibes, and the servers are just trying to survive. Check back soon—we promise it will be worth the wait (and fewer bugs)!</p>
    </section>
  </main>

  <footer class="page-footer">With love, Siva &amp; Vidya</footer>
</body>
</html>
